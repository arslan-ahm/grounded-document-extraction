name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Pin Python 3.12
        run: uv python install 3.12

      - name: Create the environment
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python ${{ runner.os == 'Windows' && '.venv/Scripts/python.exe' || '.venv/bin/python' }} --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch
          uv pip install --python ${{ runner.os == 'Windows' && '.venv/Scripts/python.exe' || '.venv/bin/python' }} numpy scipy pandas pillow pyyaml matplotlib pytest ruff nbformat nbconvert ipykernel
          uv pip install --python ${{ runner.os == 'Windows' && '.venv/Scripts/python.exe' || '.venv/bin/python' }} -e . --no-deps

      - name: Lint
        run: ${{ runner.os == 'Windows' && '.venv/Scripts/python.exe' || '.venv/bin/python' }} -m ruff check src scripts tests

      - name: Tests
        run: ${{ runner.os == 'Windows' && '.venv/Scripts/python.exe' || '.venv/bin/python' }} -m pytest tests -q -m "not slow"

      # The slow tests train real (tiny) models end to end, so they are the
      # ones that catch wiring bugs between modules. They are the reason a
      # `-m "not slow"` run is not evidence that the suite passes.
      # Linux only, to keep the matrix cheap.
      - name: Slow tests (end to end)
        if: matrix.os == 'ubuntu-latest'
        run: ${{ runner.os == 'Windows' && '.venv/Scripts/python.exe' || '.venv/bin/python' }} -m pytest tests -q -m slow

      - name: Smoke pipeline
        run: ${{ runner.os == 'Windows' && '.venv/Scripts/python.exe' || '.venv/bin/python' }} scripts/train.py --config configs/smoke.yaml
